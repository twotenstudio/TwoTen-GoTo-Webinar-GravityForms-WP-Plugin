name: Release

# Push a tag like v1.2.0 (matching the Version header) to publish a release.
# The plugin's built-in updater reads the latest release and offers it on
# the WordPress Plugins screen.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches plugin version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          grep -Eq "^ \* Version:[[:space:]]+${VER}[[:space:]]*$" twoten-goto-webinar-gravityforms.php \
            || { echo "::error::Plugin 'Version' header does not match tag ${GITHUB_REF_NAME}"; exit 1; }
          grep -Fq "define( 'TTS_GTW_VERSION', '${VER}' );" twoten-goto-webinar-gravityforms.php \
            || { echo "::error::TTS_GTW_VERSION constant does not match tag ${GITHUB_REF_NAME}"; exit 1; }
          grep -Eq "^Stable tag: ${VER}[[:space:]]*$" readme.txt \
            || { echo "::error::readme.txt 'Stable tag' does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Lint PHP
        run: |
          for f in $(git ls-files '*.php'); do php -l "$f"; done

      - name: Build plugin ZIP
        run: |
          git archive --format=zip \
            --prefix=twoten-goto-webinar-gravityforms/ \
            -o twoten-goto-webinar-gravityforms.zip "$GITHUB_REF_NAME"
          unzip -l twoten-goto-webinar-gravityforms.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" twoten-goto-webinar-gravityforms.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
